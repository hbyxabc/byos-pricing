name: materialize-index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode zlib b64 to index.html
        run: |
          set -euo pipefail
          python3 -c 'import base64,zlib,pathlib,hashlib; c=pathlib.Path("zlib.part0").read_text().strip(); b=zlib.decompress(base64.b64decode(c)); pathlib.Path("index.html").write_bytes(b); print("size",len(b)); print("sha256",hashlib.sha256(b).hexdigest()); assert len(b)==31392; assert hashlib.sha256(b).hexdigest()=="5a1f895c3d582bc40fad7589fd17c1039665a850dabe60b874285f6e10c36d61"'
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rewrite IA: Chinese role-based pricing page" || echo "no change"
          git push
