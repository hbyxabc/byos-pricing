name: materialize-index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode zlib b64 to index.html
        run: |
          set -euo pipefail
          python3 -c 'import base64,zlib,pathlib,hashlib; c="".join(pathlib.Path(f"zlib.part{i}").read_text() for i in range(3)); b=zlib.decompress(base64.b64decode(c)); pathlib.Path("index.html").write_bytes(b); print("size",len(b)); print("sha256",hashlib.sha256(b).hexdigest()); assert len(b)==58774; assert hashlib.sha256(b).hexdigest()=="d1486af512992f05f0805ba1adb148eb62b70deec6b369ec398b73743eb51aa5"'
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile layout: remove sticky traps, wrap presets, collapse RAP note" || echo "no change"
          git push
