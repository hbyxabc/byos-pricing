name: materialize-index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and decode
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=sorted(Path(".").glob("data.b64.part*")); Path("/tmp/all.b64").write_text("".join(x.read_text() for x in p)); import base64; Path("index.html").write_bytes(base64.b64decode(Path("/tmp/all.b64").read_text())); b=Path("index.html").read_bytes(); import hashlib; print("size",len(b)); print("sha256",hashlib.sha256(b).hexdigest()); assert len(b)==56423'
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add BYOS pricing interactive model" || echo "no change"
          git push
